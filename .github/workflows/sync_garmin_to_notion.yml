name: Sync Garmin to Notion

on:
  schedule:
    - cron: '7 15 * * *' # Daily, 8:17 AM Pacific (UTC-7, year-round)
  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 5
env:
  TZ: 'America/Toronto'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run script
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '5' }}
          DEFAULT_SHOE_ID: ${{ secrets.DEFAULT_SHOE_ID }}
          GARMIN_TOKEN_OUT: ${{ runner.temp }}/garmin_token.json
          TZ: 'America/Toronto'
        run: |
          uv run python -m src.workflows.garmin-activities

      # Garmin tokens expire after a few days unless the refreshed one is kept.
      # This saves the token from this run back into the GARMIN_AUTH_TOKEN secret.
      - name: Save refreshed Garmin token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          GARMIN_TOKEN_OUT: ${{ runner.temp }}/garmin_token.json
        run: |
          if [ -s "$GARMIN_TOKEN_OUT" ]; then
            gh secret set GARMIN_AUTH_TOKEN --repo "${{ github.repository }}" < "$GARMIN_TOKEN_OUT"
            rm -f "$GARMIN_TOKEN_OUT"
          else
            echo "No token file written; leaving GARMIN_AUTH_TOKEN unchanged."
          fi
